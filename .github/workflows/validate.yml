name: Validate Luna skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-contracts:
    name: Skill contracts (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test research checker
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .agents/skills/run-diverse-luna-research/scripts/test_check_setup.py
      - name: Test project checker
        env:
          PYTHONUTF8: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: python .agents/skills/run-diverse-luna-project/scripts/test_check_setup.py
      - name: Parse project-scoped agents and verify local Markdown links
        env:
          PYTHONUTF8: "1"
        run: python tools/validate_repository.py

  migration-safety:
    name: Migration safety (PowerShell)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Run non-mutating migration tests
        shell: pwsh
        run: >-
          ./tools/Test-LunaMigrationTools.ps1
          -Source (Resolve-Path -LiteralPath '.agents/skills').Path
