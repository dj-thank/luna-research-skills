name: Validate Luna skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-matrix:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      # Keep each native command in its own step: PowerShell otherwise reports
      # only the last command's exit status and can hide an earlier failure.
      - name: Check research setup
        run: python .agents/skills/run-diverse-luna-research/scripts/test_check_setup.py
      - name: Check project setup
        run: python .agents/skills/run-diverse-luna-project/scripts/test_check_setup.py
      - name: Check research dispatch budget
        run: python .agents/skills/run-diverse-luna-research/scripts/test_dispatch_budget.py
      - name: Check project dispatch budget
        run: python .agents/skills/run-diverse-luna-project/scripts/test_dispatch_budget.py
      - name: Check research packaged swarm planner
        run: python .agents/skills/run-diverse-luna-research/scripts/test_plan_swarm.py
      - name: Check project swarm planner
        run: python .agents/skills/run-diverse-luna-project/scripts/test_plan_swarm.py
      - name: Compare swarm decisions with known answers
        run: python tools/benchmark_swarm.py
      - name: Compare bounded review policies with frozen answers
        run: python tools/benchmark_review.py
      - name: Compare scoped communication with frozen deliveries
        run: python tools/benchmark_communication.py
      - name: Run repository, release, and route-manifest tests
        run: python -m unittest discover -s tools -p 'test_*.py'
      - name: Plan cross-platform user-scope install
        run: python tools/install_luna_skills.py --target-root "${{ runner.temp }}/luna-user/.agents/skills" --json
      - name: Apply cross-platform user-scope install
        run: python tools/install_luna_skills.py --target-root "${{ runner.temp }}/luna-user/.agents/skills" --apply --json
      - name: Verify cross-platform user-scope install
        run: python tools/install_luna_skills.py --target-root "${{ runner.temp }}/luna-user/.agents/skills" --verify --json
      - name: Validate repository
        run: python tools/validate_repository.py
      - name: Validate release metadata
        run: python tools/release_metadata.py
      - name: Validate Python syntax
        run: python -m compileall -q .agents tools

  migration-safety-pwsh:
    name: Migration safety (PowerShell 7)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated migration safety tests
        shell: pwsh
        run: >-
          ./tools/Test-LunaMigrationTools.ps1
          -Source (Resolve-Path -LiteralPath '.agents/skills').Path

  migration-safety-windows-powershell:
    name: Migration safety (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run isolated migration safety tests
        shell: powershell
        run: >-
          ./tools/Test-LunaMigrationTools.ps1
          -Source (Resolve-Path -LiteralPath '.agents/skills').Path

  stress-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Repeat observed contract cases
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: python tools/stress_contracts.py --iterations 25

  cloud-smoke-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - name: Verify Cloud smoke contract without external network
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python tools/cloud_smoke.py
          --expected-head "${GITHUB_SHA}"
          --iterations 1

  stress-migration:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Repeat disposable migration attack fixtures
        shell: pwsh
        run: |
          1..5 | ForEach-Object {
            ./tools/Test-LunaMigrationTools.ps1 -Source .agents/skills
          }
